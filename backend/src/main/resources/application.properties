spring.application.name=telemedicine-backend
server.port=8080

# Profile selection: 'dev' uses in-memory H2 database with auto-created tables and demo seed data.
# Change to 'mysql' to use real local MySQL database.
spring.profiles.active=dev

# H2 Database Configuration (Default for instant local running without MySQL setup)
spring.datasource.url=jdbc:h2:mem:telemedicine_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
telemed.app.jwtSecret=TelemedicineSecretKeyForStudentProjectSuperSecure20263rdYearMiniProject
telemed.app.jwtExpirationMs=86400000

# Gemini API Integration (Optional key - falls back to robust local medical guidance rule engine when blank)
telemed.gemini.apiKey=
telemed.gemini.apiUrl=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
